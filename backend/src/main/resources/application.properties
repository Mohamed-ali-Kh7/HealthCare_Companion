spring.application.name=healthcare-companion
spring.config.import=optional:file:.env[.properties]
# PORT est fourni par les hébergeurs (Render) ; SERVER_PORT / 8081 en local
server.port=${PORT:${SERVER_PORT:8081}}

# --- Base de donnees (secrets via variables d'environnement) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare_companion?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:healthcare_user}
spring.datasource.password=${DB_PASSWORD}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT ---
# Cle Base64 de 256 bits minimum : openssl rand -base64 32
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.issuer=healthcare-companion-api

# --- Adresse publique de l'API : lien du QR code imprimé sur les ordonnances PDF ---
# Doit être joignable par le téléphone qui scanne (ex. http://192.168.1.20:8081 en réseau local)
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8081}

# --- Fuseau horaire metier (rendez-vous, plannings, resumes journaliers) ---
app.timezone=Africa/Tunis

# --- CORS (utile pour Flutter Web uniquement ; les apps mobiles ne sont pas concernees) ---
app.cors.allowed-origins=http://localhost:*

# --- Donnees initiales ---
# Le compte admin n'est cree que si ADMIN_PASSWORD est defini et qu'aucun admin n'existe.
app.seed.admin-email=${ADMIN_EMAIL:admin@healthcare.local}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.demo-data=false
app.seed.demo-password=${DEMO_PASSWORD:Demo12345}

# --- Messagerie, messages vocaux et appels ---
app.messaging.max-voice-seconds=300
app.messaging.ring-timeout-seconds=45
# STUN public gratuit (connexion directe entre les deux appareils)
app.messaging.stun-urls=stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302
# TURN optionnel (relais si la connexion directe échoue, ex. certains réseaux mobiles)
app.messaging.turn-url=${TURN_URL:}
app.messaging.turn-username=${TURN_USERNAME:}
app.messaging.turn-credential=${TURN_CREDENTIAL:}
# Messages vocaux : 5 Mo maximum (marge pour l'enveloppe multipart)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# --- Assistant santé (IA) ---
# Sans clé, l'assistant fonctionne en mode de secours (règles, détection d'urgence, transmission au médecin)
app.assistant.api-key=${ANTHROPIC_API_KEY:}
app.assistant.model=${ASSISTANT_MODEL:claude-opus-5-5}
app.assistant.history-size=20
# Si le modèle refuse une demande, l'API la rejoue automatiquement sur un autre modèle
app.assistant.server-fallbacks=true
app.assistant.base-url=${ANTHROPIC_BASE_URL:}

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Facturation : part CNAM SIMULÉE (aucune connexion à la CNAM), identique pour tous les actes
app.billing.cnam-rate-percent=${CNAM_RATE_PERCENT:70}

# --- E-mails (codes de vérification d'inscription et de mot de passe oublié) ---
# MAIL_ENABLED=false : aucun e-mail envoyé, la vérification d'e-mail n'est PAS exigée à l'inscription,
#                      les codes de réinitialisation sont seulement écrits dans les logs (développement).
# MAIL_PROVIDER=smtp  : serveur SMTP (Gmail : mot de passe d'application). Bloqué sur le plan gratuit de Render.
# MAIL_PROVIDER=brevo : API HTTPS de Brevo (fonctionne sur le plan gratuit de Render), clé BREVO_API_KEY.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:HealthCare Companion}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.code-ttl-minutes=15
app.mail.resend-cooldown-seconds=60
app.mail.max-attempts=5
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
