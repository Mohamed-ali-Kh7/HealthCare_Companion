spring.application.name=healthcare-companion
server.port=8080

# --- Base de donnees (secrets via variables d'environnement) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare_companion?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:healthcare_user}
spring.datasource.password=${DB_PASSWORD}

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- JWT ---
# Cle Base64 de 256 bits minimum : openssl rand -base64 32
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.issuer=healthcare-companion-api

# --- Fuseau horaire metier (rendez-vous, plannings, resumes journaliers) ---
app.timezone=Africa/Tunis

# --- CORS (utile pour Flutter Web uniquement ; les apps mobiles ne sont pas concernees) ---
app.cors.allowed-origins=http://localhost:*

# --- Donnees initiales ---
# Le compte admin n'est cree que si ADMIN_PASSWORD est defini et qu'aucun admin n'existe.
app.seed.admin-email=${ADMIN_EMAIL:admin@healthcare.local}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.demo-data=false
app.seed.demo-password=${DEMO_PASSWORD:Demo12345}

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
