# Render Blueprint — hosts the Spring Boot API from backend/Dockerfile.
# The database is external (Neon PostgreSQL); its credentials are entered in the Render dashboard, never committed.
#
# Render dashboard → New → Blueprint → pick this repository → fill in the values marked "sync: false".
services:
  - type: web
    name: healthcare-companion-api
    runtime: docker
    plan: free
    region: frankfurt                 # same region as the Neon database (eu-central-1)
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/specialities
    autoDeploy: true
    envVars:
      - key: DB_URL                   # jdbc:postgresql://<neon-host>/neondb?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET               # random 256-bit base64 value generated by Render
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@healthcare.local
      - key: ADMIN_PASSWORD           # admin account created on first start
        sync: false
      - key: APP_SEED_DEMODATA        # demo accounts and data (set to "false" for real use)
        value: "true"
      - key: DEMO_PASSWORD
        value: Demo12345
