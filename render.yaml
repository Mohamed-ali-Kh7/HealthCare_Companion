# Render Blueprint — hosts the Spring Boot API from backend/Dockerfile.
# The database is external (Neon PostgreSQL); its credentials are entered in the Render dashboard, never committed.
#
# Render dashboard → New → Blueprint → pick this repository → fill in the values marked "sync: false".
services:
  - type: web
    name: healthcare-companion-api
    runtime: docker
    plan: free
    region: frankfurt                 # same region as the Neon database (eu-central-1)
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/specialities
    autoDeploy: true
    envVars:
      - key: DB_URL                   # jdbc:postgresql://<neon-host>/neondb?sslmode=require
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET               # random 256-bit base64 value generated by Render
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@healthcare.local
      - key: ADMIN_PASSWORD           # admin account created on first start
        sync: false
      - key: APP_SEED_DEMODATA        # demo accounts and data (set to "false" for real use)
        value: "true"
      - key: DEMO_PASSWORD
        value: Demo12345
      # E-mails (sign-up verification code, forgot password). Unset/false = no e-mail, no verification.
      # Free plan: outbound SMTP (ports 25/465/587) is blocked by Render → use MAIL_PROVIDER=brevo there.
      - key: MAIL_ENABLED             # "true" to send e-mails and require e-mail verification
        sync: false
      - key: MAIL_PROVIDER            # brevo (HTTPS API, works on the free plan) or smtp (paid plan only)
        sync: false
      - key: MAIL_FROM                # sender address (must be a verified sender in Brevo)
        sync: false
      - key: BREVO_API_KEY            # provider = brevo
        sync: false
      - key: SMTP_USERNAME            # provider = smtp (Gmail address)
        sync: false
      - key: SMTP_PASSWORD            # provider = smtp (Gmail app password)
        sync: false
